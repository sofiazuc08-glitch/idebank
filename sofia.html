<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idebank - Opret ny idé</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 40px;
            text-align: center;
            text-transform: capitalize;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 16px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
            transition: border-color 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        select {
            cursor: pointer;
            background-color: white;
        }

        .submit-button {
            width: 100%;
            padding: 12px;
            margin-top: 30px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            transition: background-color 0.3s ease;
        }

        .submit-button:hover {
            background-color: #764ba2;
        }

        .submit-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Opret ny idé</h1>
        
        <form id="ideForm">
            <div class="form-group">
                <label for="titel">Titel</label>
                <input type="text" id="titel" name="titel" placeholder="Indtast titel på din idé" required>
            </div>

            <div class="form-group">
                <label for="kategori">Kategori</label>
                <select id="kategori" name="kategori" required>
                    <option value="">Vælg en kategori</option>
                    <option value="besparelser">Besparelser</option>
                    <option value="forretningsudvikling">Forretningsudvikling</option>
                    <option value="arbejdsmiljo">Arbejdsmiljø</option>
                    <option value="effektivisering">Effektivisering</option>
                    <option value="it-teknologi">IT og teknologi</option>
                    <option value="andet">Andet</option>
                </select>
            </div>

            <div class="form-group">
                <label for="beskrivelse">Beskrivelse</label>
                <textarea id="beskrivelse" name="beskrivelse" placeholder="Beskriv din idé i detaljer" required></textarea>
            </div>

            <button type="submit" class="submit-button">Send idé</button>
        </form>
    </div>

    <script>
        document.getElementById('ideForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const titel = document.getElementById('titel').value;
            const kategori = document.getElementById('kategori').value;
            const beskrivelse = document.getElementById('beskrivelse').value;
            const medarbejder = localStorage.getItem('username');
            
            if (titel.trim() === '' || kategori === '' || beskrivelse.trim() === '') {
                alert('Udfyld venligst alle felter');
                return;
            }
            
            let ideas = JSON.parse(localStorage.getItem('ideas')) || [];
            
            const medarbejderId = Math.abs(medarbejder.split('').reduce((a, b) => {
                a = ((a << 5) - a) + b.charCodeAt(0);
                return a & a;
            }, 0));
            
            const newIdea = {
                id: Date.now(),
                titel: titel,
                kategori: kategori,
                beskrivelse: beskrivelse,
                medarbejder: medarbejder,
                medarbejderId: medarbejderId,
                dato: new Date().toLocaleDateString('da-DK')
            };
            
            ideas.push(newIdea);
            localStorage.setItem('ideas', JSON.stringify(ideas));
            
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
