<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idebank - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .header {
            background-color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 32px;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logout-button {
            padding: 10px 25px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        .logout-button:hover {
            background-color: #764ba2;
        }

        .container {
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
        }

        .welcome {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .welcome h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 30px;
        }

        .create-button {
            width: 100%;
            padding: 15px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: background-color 0.3s ease;
            margin-bottom: 30px;
        }

        .create-button:hover {
            background-color: #764ba2;
        }

        .ideas-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .ideas-section h3 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .idea-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .idea-card h4 {
            color: #333;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .idea-card .kategori {
            display: inline-block;
            background-color: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .idea-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .idea-card .dato {
            color: #999;
            font-size: 12px;
            font-style: italic;
        }

        .empty-message {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>IDEBANK</h1>
        <button class="logout-button" onclick="logout()">Log ud</button>
    </div>

    <div class="container">
        <div class="welcome">
            <h2>Hej, <span id="username">Bruger</span>!</h2>
            <button class="create-button" onclick="createIdea()">+ Opret ny idé</button>
        </div>

        <div class="ideas-section">
            <h3>Mine idéer</h3>
            <div id="ideas-list">
                <p class="empty-message">Du har endnu ikke oprettet nogle idéer. Klik på "Opret ny idé" for at starte!</p>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', function() {
            loadDashboard();
        });

        function loadDashboard() {
            const username = localStorage.getItem('username');
            const isAdmin = localStorage.getItem('isAdmin') === 'true';
            
            if (isAdmin) {
                window.location.href = 'empty.html';
                return;
            }
            
            if (!username) {
                window.location.href = 'tom.html';
                return;
            }
            
            document.getElementById('username').textContent = username;
            loadIdeas(username);
        }

        function loadIdeas(username) {
            const ideasJSON = localStorage.getItem('ideas');
            const ideas = ideasJSON ? JSON.parse(ideasJSON) : [];
            const ideasList = document.getElementById('ideas-list');
            
            const userIdeas = ideas.filter(idea => idea.medarbejder === username);
            
            if (!userIdeas || userIdeas.length === 0) {
                ideasList.innerHTML = '<p class="empty-message">Du har endnu ikke oprettet nogle idéer. Klik på "Opret ny idé" for at starte!</p>';
                return;
            }
            
            ideasList.innerHTML = '';
            userIdeas.forEach(idea => {
                const ideaCard = document.createElement('div');
                ideaCard.className = 'idea-card';
                ideaCard.innerHTML = `
                    <h4>${idea.titel}</h4>
                    <span class="kategori">${idea.kategori}</span>
                    <p>${idea.beskrivelse}</p>
                    <div class="dato">Oprettet: ${idea.dato}</div>
                `;
                ideasList.appendChild(ideaCard);
            });
        }

        function createIdea() {
            window.location.href = 'sofia.html';
        }

        function logout() {
            localStorage.removeItem('username');
            localStorage.removeItem('isAdmin');
            window.location.href = 'tom.html';
        }
    </script>
</body>
</html>
